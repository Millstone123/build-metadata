[build-system]
requires = [
  "setuptools>=61",
  "build-rules @ https://github.com/Millstone123/build-rules/releases/download/v0.1.0/build_rules-0.1.0-py3-none-any.whl",
]
build-backend = "setuptools.build_meta"

[project]
name = "build-metadata"
version = "0.1.0"
description = "Build system metadata consistency validator"
dependencies = ["pytest>=7.0", "pyyaml>=6.0"]

[project.entry-points.pytest11]
build_meta_check = "build_meta.plugin"
